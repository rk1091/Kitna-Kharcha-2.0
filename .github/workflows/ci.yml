name: CI Pipeline

on:
  push:
    branches: [ main, prototype/v1-deployment, dev/v2-execution, "feat/*", "fix/*", "dev/*" ]
  pull_request:
    branches: [ main, dev/v2-execution ]

jobs:
  backend-checks:
    name: Backend Validation, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Prisma Validate & Generate
        run: cd backend && npx prisma validate && npx prisma generate

      - name: Run Backend Tests
        run: cd backend && npm test

      - name: Build Backend Application
        run: cd backend && npm run build

  frontend-checks:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build Frontend Application
        run: cd frontend && npm run build
